name: Test CMake

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Download Windows 7.1 SDK
        shell: powershell
        run: |
          $VS_BTOOLS_EXE="GRMSDKX_EN_DVD.iso"
          $VS_BTOOLS_URI="http://download.microsoft.com/download/F/1/0/F10113F5-B750-4969-A255-274341AC6BCE/GRMSDKX_EN_DVD.iso"
          Invoke-WebRequest -Uri $VS_BTOOLS_URI -OutFile $VS_BTOOLS_EXE

      - name: Install Windows 7.1 SDK
        run: Dism /Mount-Image /ImageFile:"GRMSDKX_EN_DVD.iso" /index:1 /MountDir:"C:\win7sdk"

      - name: List dir
        run: dir /S C:\win7sdk
