name: Test CMake

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Compile
        shell: cmd
        run: |
          mkdir build
          cmake -S . -B build -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 ^
          -DCMAKE_BUILD_TYPE=Release ^
          cmake --build build
